<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10091b">
<title>سایت رسمی آزادشهر</title>
<style>
:root{--bg:#0b0711;--panel:#171022;--purple:#9b5cff;--purple-light:#d1b3ff;--text:#f7f1ff;--muted:#c7bbd8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at 50% 0%,rgba(128,55,214,.25),transparent 55%),linear-gradient(145deg,#08060c,#160b24 55%,#09070e)}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(100%,560px);text-align:center;padding:36px 25px;border:1px solid rgba(183,132,255,.32);border-radius:26px;background:linear-gradient(160deg,rgba(35,21,52,.96),rgba(15,10,22,.98));box-shadow:0 20px 70px rgba(0,0,0,.48),0 0 35px rgba(133,64,220,.12)}
h1{margin:0 0 18px;font-size:clamp(25px,6vw,34px);line-height:1.7;color:var(--purple-light)}
p{margin:0 auto 28px;max-width:430px;color:var(--muted);font-size:17px;line-height:2.2}
.enter{min-width:180px;padding:15px 32px;border:0;border-radius:14px;color:white;background:linear-gradient(135deg,#a45cff,#7027c4);font:bold 18px Tahoma,Arial,sans-serif;box-shadow:0 8px 24px rgba(133,57,217,.3);cursor:pointer}
.enter:active{transform:scale(.98)}
.footer{margin-top:25px;color:#88789b;font-size:12px}
#home{display:none;min-height:100vh;padding:24px 16px 45px}
.top-hint{position:sticky;top:10px;z-index:3;width:fit-content;max-width:100%;margin:0 auto 28px;padding:13px 20px;border:1px solid #7042a6;border-radius:16px;background:rgba(17,10,28,.92);color:#e4d2ff;text-align:center;font-size:15px;box-shadow:0 8px 28px #0006;backdrop-filter:blur(8px)}
.arrow{display:block;font-size:24px;line-height:1.2;margin-top:4px;animation:bob 1.1s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.content{width:min(100%,850px);margin:auto}
.section{margin:18px 0 26px;padding:22px;border:1px solid #38234e;border-radius:22px;background:rgba(23,16,34,.88);box-shadow:0 12px 35px #0003}
.section h2{margin:0 0 16px;color:var(--purple-light);font-size:23px;line-height:1.8}
.hero{width:100%;display:block;border-radius:16px;border:1px solid #53366f;object-fit:cover}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gallery img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid #53366f;box-shadow:0 6px 20px #0005}
@media(max-width:480px){.section{padding:15px}.gallery{grid-template-columns:1fr}.top-hint{font-size:14px}}
.jobs-title{margin:18px 0 10px;color:var(--purple-light);font-size:18px;font-weight:bold}
.jobs-title:first-of-type{margin-top:0}
.jobs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.jobs li{padding:10px 18px;border:1px solid #53366f;border-radius:12px;background:rgba(155,92,255,.12);color:var(--text);font-size:16px}
.jobs.soon li{opacity:.8;border-style:dashed}
.dl-btn{display:block;width:100%;margin:0 0 12px;padding:16px 20px;border:0;border-radius:14px;color:#fff;background:linear-gradient(135deg,#a45cff,#7027c4);font:bold 17px Tahoma,Arial,sans-serif;box-shadow:0 8px 24px rgba(133,57,217,.3);cursor:pointer}
.dl-btn.myket{background:linear-gradient(135deg,#2f8cff,#1c4fd1);box-shadow:0 8px 24px rgba(40,110,230,.3)}
.dl-btn:active{transform:scale(.98)}
.dl-msg{display:none;margin-top:6px;padding:14px 16px;border:1px solid #7042a6;border-radius:14px;background:rgba(17,10,28,.92);color:#e4d2ff;text-align:center;font-size:16px;line-height:2}
</style>
</head>
<body>
<section class="screen" id="welcome">
  <main class="card">
    <h1>سلام رفیق آزادشهری!</h1>
    <p>اینجا سایت رسمی آزادشهره و تمام اطلاعات بازی توشه 🔥<br>برای ورود روی دکمه ورود بزن</p>
    <button class="enter" id="enterBtn" type="button">ورود</button>
    <div class="footer">آزادشهر • دنیای ماجراجویی تو</div>
  </main>
</section>
